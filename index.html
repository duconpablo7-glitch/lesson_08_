<!doctype html>
<html lang="fr">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Recherche de films</title>
		<style>
			* { box-sizing: border-box; }
			body {
				min-height: 100vh;
				margin: 0;
				display: grid;
				place-items: center;
				padding: 24px;
				color: #f8fafc;
				background: radial-gradient(ellipse at top, #26355a 0%, #111827 56%, #090d17 100%);
				font-family: system-ui, sans-serif;
			}
			main { width: min(100%, 680px); text-align: center; }
			h1 { margin: 0 0 10px; font-size: clamp(2rem, 6vw, 3.5rem); }
			.intro { margin: 0 0 28px; color: #b6c2d5; }
			form { display: flex; gap: 10px; max-width: 560px; margin: 0 auto; }
			input, button { min-height: 52px; border: 0; border-radius: 12px; font: inherit; }
			input { flex: 1; min-width: 0; padding: 0 16px; color: #111827; background: #fff; }
			button { padding: 0 24px; color: #fff; background: #7564f5; font-weight: 700; cursor: pointer; }
			button:hover { background: #6251e8; }
			button:disabled { opacity: .65; cursor: wait; }
			#status { min-height: 24px; margin: 18px 0; color: #cbd5e1; }
			#results { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; text-align: left; }
			.movie { display: flex; gap: 14px; padding: 14px; border: 1px solid #334155; border-radius: 14px; background: #182235; }
			.movie img { width: 76px; height: 112px; flex: 0 0 76px; border-radius: 7px; object-fit: cover; background: #29364b; }
			.movie h2 { margin: 4px 0 7px; font-size: 1rem; }
			.movie p { margin: 0; color: #b6c2d5; font-size: .9rem; }
			@media (max-width: 440px) { form { flex-direction: column; } }
		</style>
	</head>
	<body>
		<main>
			<h1>Recherche de films</h1>
			<p class="intro">Saisis un titre pour trouver des films avec OMDb.</p>
			<form id="search-form">
				<input id="title" name="title" type="search" placeholder="Ex. : Le voyage de Chihiro" aria-label="Titre du film" required>
				<button id="search-button" type="submit">Chercher</button>
			</form>
			<p id="status" role="status" aria-live="polite"></p>
			<section id="results" aria-label="Résultats de recherche"></section>
		</main>
		<script>
			const form = document.querySelector('#search-form');
			const titleInput = document.querySelector('#title');
			const button = document.querySelector('#search-button');
			const status = document.querySelector('#status');
			const results = document.querySelector('#results');

			form.addEventListener('submit', async (event) => {
				event.preventDefault();
				const title = titleInput.value.trim();
				if (!title) return;

				button.disabled = true;
				status.textContent = 'Recherche en cours…';
				results.replaceChildren();

				try {
					if (location.protocol === 'file:') {
						throw new Error('Ouvre cette page depuis le serveur : lance « npm start », puis va sur http://localhost:3000.');
					}
					const response = await fetch(`/api/search?title=${encodeURIComponent(title)}`);
					const data = await response.json();
					if (!response.ok) throw new Error(data.error || 'La recherche a échoué.');

					for (const movie of data.Search || []) {
						const card = document.createElement('article');
						card.className = 'movie';
						const poster = document.createElement('img');
						poster.src = movie.Poster && movie.Poster !== 'N/A' ? movie.Poster : '';
						poster.alt = movie.Poster && movie.Poster !== 'N/A' ? `Affiche de ${movie.Title}` : 'Affiche indisponible';
						const details = document.createElement('div');
						const heading = document.createElement('h2');
						heading.textContent = movie.Title;
						const year = document.createElement('p');
						year.textContent = `${movie.Year} · ${movie.Type === 'movie' ? 'Film' : movie.Type}`;
						details.append(heading, year);
						card.append(poster, details);
						results.append(card);
					}
					status.textContent = data.Search?.length ? `${data.Search.length} résultat(s)` : 'Aucun film trouvé.';
				} catch (error) {
					status.textContent = /networkerror|failed to fetch|load failed/i.test(error.message)
						? 'Impossible de joindre le serveur. Lance « npm start » et ouvre http://localhost:3000.'
						: error.message;
				} finally {
					button.disabled = false;
				}
			});
		</script>
	</body>
</html>
